<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenAI Visualizer — interactive demos for understanding generative AI</title>
    <meta name="description" content="Twelve interactive, offline-safe demos that take generative AI buzzwords — tokens, embeddings, attention, RAG, agents — and turn them into something you can poke at, break, and intuit." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#818cf8" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />

    <!-- Font: JetBrains Mono throughout -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme init: runs before paint so there's no flash.
         Default is dark unless the user explicitly chose light. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("gv-theme");
          document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
